<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HERO BY LIOR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Heebo', sans-serif;
            background: #faf7f4;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* ─── HERO ─── */
        .hero {
            background: linear-gradient(180deg, #2e1020 0%, #6b2e3f 100%);
            padding: 52px 32px 0;
            text-align: center;
            position: relative;
        }

        /* thin gold-ish line at very top */
        .hero::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 36px;
            right: 36px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(245,230,210,0.22), transparent);
        }

        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-12px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .logo-wrap {
            animation: fadeDown 0.7s ease-out both;
            margin-bottom: 26px;
        }

        .logo-wrap img {
            width: 210px;
            height: 210px;
            object-fit: cover;
            border-radius: 34px;
            display: block;
            margin: 0 auto;
            box-shadow:
                0 2px 0 rgba(255,255,255,0.08),
                0 20px 60px rgba(0,0,0,0.45),
                0 8px 20px rgba(0,0,0,0.25);
        }

        .hero-subtitle {
            font-family: 'Heebo', sans-serif;
            font-size: 1.42rem;
            font-weight: 400;
            font-style: normal;
            color: rgba(245, 228, 208, 0.82);
            line-height: 1.9;
            letter-spacing: 0.12em;
            padding-bottom: 42px;
            animation: fadeDown 0.7s ease-out 0.1s both;
        }

        /* ─── WAVE DIVIDER ─── */
        .wave {
            display: block;
            background: #faf7f4;
            line-height: 0;
        }
        .wave svg {
            display: block;
            width: 100%;
            height: 56px;
        }

        /* ─── CONTENT ─── */
        .content {
            background: #faf7f4;
            padding: 30px 28px 50px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeUp 0.7s ease-out 0.2s both;
        }

        .thin-rule {
            width: 38px;
            height: 1px;
            background: #6b2e3f;
            opacity: 0.3;
            margin-bottom: 22px;
        }

        .quote {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.1rem;
            font-style: italic;
            color: #5a3a42;
            line-height: 1.95;
            margin-bottom: 26px;
        }

        .location {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: #9a8590;
            font-size: 0.8rem;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            margin-bottom: 30px;
        }
        .location svg {
            width: 11px;
            height: 11px;
            fill: #6b2e3f;
            opacity: 0.55;
            flex-shrink: 0;
        }

        /* ─── BUTTONS ─── */
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            padding: 15px 24px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 0.92rem;
            font-weight: 500;
            letter-spacing: 0.02em;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }
        .btn svg { width: 17px; height: 17px; flex-shrink: 0; }

        .btn-primary {
            background: linear-gradient(135deg, #6b2e3f 0%, #4a1e2e 100%);
            color: #f5ede8;
            box-shadow: 0 4px 20px rgba(107,46,63,0.28);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(107,46,63,0.38);
        }

        .btn-outline {
            background: #fff;
            color: #4a2530;
            border: 1px solid #e2d0d4;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .btn-outline:hover {
            border-color: #6b2e3f;
            transform: translateY(-2px);
            box-shadow: 0 5px 16px rgba(107,46,63,0.12);
        }

        @media (max-width: 380px) {
            .hero { padding: 40px 22px 0; }
            .logo-wrap img { width: 180px; height: 180px; border-radius: 28px; }
            .hero-subtitle { font-size: 1.05rem; }
            .content { padding: 24px 18px 40px; }
            .btn { padding: 13px 20px; font-size: 0.88rem; }
        }
    </style>
</head>

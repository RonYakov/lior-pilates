<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lior Hershko - אימוני פילאטיס</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Heebo', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #f5d5c4 0%, #e8b8a0 50%, #f0c4ad 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            right: -20%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            animation: float 20s ease-in-out infinite;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -30%;
            left: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(212, 160, 137, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            animation: float 25s ease-in-out infinite reverse;
            pointer-events: none;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-30px, 30px) scale(1.05); }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .container {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 56px 40px;
            max-width: 460px;
            width: 100%;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.15), 0 10px 30px rgba(212, 160, 137, 0.1);
            text-align: center;
            position: relative;
            z-index: 1;
            animation: scaleIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .avatar {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: linear-gradient(135deg, #faf8f5 0%, #f5f0ea 100%);
            margin: 0 auto 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 15px 40px rgba(212, 160, 137, 0.25), 0 5px 15px rgba(0, 0, 0, 0.08);
            animation: scaleIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s both;
            position: relative;
            overflow: hidden;
        }

        .avatar::before {
            content: '';
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(232, 184, 160, 0.3), rgba(200, 144, 120, 0.3));
            z-index: -1;
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.3; }
        }

        h1 {
            font-size: 36px;
            font-weight: 500;
            color: #1a1a1a;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
            animation: fadeInUp 0.8s ease 0.3s both;
        }

        .subtitle {
            font-size: 19px;
            color: #666;
            margin-bottom: 40px;
            font-weight: 300;
            letter-spacing: 0.3px;
            line-height: 1.6;
            animation: fadeInUp 0.8s ease 0.4s both;
        }

        .divider {
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #d4a089, transparent);
            margin: 0 auto 36px;
            border-radius: 2px;
            animation: fadeInUp 0.8s ease 0.5s both;
        }

        .quote-box {
            background: linear-gradient(135deg, rgba(212, 160, 137, 0.08) 0%, rgba(232, 184, 160, 0.12) 100%);
            border-right: 3px solid #d4a089;
            border-radius: 12px;
            padding: 20px 24px;
            margin: 0 0 36px;
            animation: fadeInUp 0.8s ease 0.6s both;
        }

        .quote-text {
            font-size: 16px;
            line-height: 1.7;
            color: #555;
            font-weight: 400;
            font-style: italic;
            margin: 0;
            letter-spacing: 0.2px;
        }

        .quote-box {
            background: linear-gradient(135deg, rgba(212, 160, 137, 0.08) 0%, rgba(232, 184, 160, 0.12) 100%);
            border-right: 3px solid #d4a089;
            border-radius: 12px;
            padding: 20px 24px;
            margin: 0 0 36px;
            animation: fadeInUp 0.8s ease 0.6s both;
        }

        .quote-text {
            font-size: 16px;
            line-height: 1.7;
            color: #555;
            font-weight: 400;
            font-style: italic;
            margin: 0;
            letter-spacing: 0.2px;
        }

        .location {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 15px;
            color: #777;
            margin-bottom: 44px;
            padding: 10px 20px;
            background: rgba(212, 160, 137, 0.08);
            border-radius: 20px;
            font-weight: 400;
            animation: fadeInUp 0.8s ease 0.7s both;
        }

        .location svg {
            width: 16px;
            height: 16px;
            fill: #d4a089;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 18px 28px;
            border-radius: 16px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: none;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            letter-spacing: 0.3px;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 55%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-whatsapp {
            background: linear-gradient(135deg, #25D366 0%, #20ba5a 100%);
            color: white;
            box-shadow: 0 8px 24px rgba(37, 211, 102, 0.35), 0 3px 8px rgba(0, 0, 0, 0.1);
            animation: fadeInUp 0.8s ease 0.8s both;
        }

        .btn-whatsapp:hover {
            box-shadow: 0 12px 32px rgba(37, 211, 102, 0.45), 0 6px 12px rgba(0, 0, 0, 0.15);
            transform: translateY(-2px);
        }

        .btn-instagram {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            color: white;
            box-shadow: 0 8px 24px rgba(225, 48, 108, 0.35), 0 3px 8px rgba(0, 0, 0, 0.1);
            animation: fadeInUp 0.8s ease 0.9s both;
        }

        .btn-instagram:hover {
            box-shadow: 0 12px 32px rgba(225, 48, 108, 0.45), 0 6px 12px rgba(0, 0, 0, 0.15);
            transform: translateY(-2px);
        }

        .btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
            position: relative;
            z-index: 1;
            transition: transform 0.3s ease;
        }

        .btn:hover svg {
            transform: scale(1.1) rotate(-5deg);
        }

        .btn span {
            position: relative;
            z-index: 1;
        }

        @media (max-width: 480px) {
            .container {
                padding: 44px 28px;
                border-radius: 28px;
            }

            h1 {
                font-size: 32px;
            }

            .subtitle {
                font-size: 17px;
            }

            .avatar {
                width: 140px;
                height: 140px;
                font-size: 44px;
            }

            .btn {
                padding: 16px 24px;
                font-size: 15px;
            }
        }

        @media (min-width: 768px) {
            .container {
                padding: 64px 52px;
            }
        }
    </style>
</head>
